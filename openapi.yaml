openapi: 3.0.3
info:
  title: DOGFOOD API
  version: 0.1.0
  description: 'Hackathon judging, voting, and management API. Note that admin/service routes typically wrap responses in { data: ... } while some public routes return unwrapped JSON. Error formats also vary between wrapped structured objects and raw string messages.'
servers:
  - url: 'http://localhost:3000'
    description: Local deployment
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorStandard:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    ErrorString:
      type: object
      properties:
        error:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time
    Hackathon:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - DRAFT
            - ACTIVE
            - COMPLETED
        policy_id:
          type: string
          format: uuid
          nullable: true
        required_judges:
          type: integer
          nullable: true
        submissions_close:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hackathon_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
    Submission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hackathon_id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
          nullable: true
        link:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    GallerySubmission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        team_name:
          type: string
    JudgeAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hackathon_id:
          type: string
          format: uuid
        judge_user_id:
          type: string
          format: uuid
        submission_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    JudgeInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hackathon_id:
          type: string
          format: uuid
        submission_id:
          type: string
          format: uuid
        judge_user_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - DECLINED
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Policy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
        version:
          type: integer
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Criterion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        policy_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        min_score:
          type: integer
        max_score:
          type: integer
        weight:
          type: integer
        display_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PolicyWithCriteria:
      allOf:
        - $ref: '#/components/schemas/Policy'
        - type: object
          properties:
            criteria:
              type: array
              items:
                $ref: '#/components/schemas/Criterion'
    Evaluation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hackathon_id:
          type: string
          format: uuid
        judge_user_id:
          type: string
          format: uuid
        submission_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - DRAFT
            - SUBMITTED
        total_score:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EvaluationScore:
      type: object
      properties:
        criterion_id:
          type: string
          format: uuid
        raw_score:
          type: integer
    EvaluationDetail:
      type: object
      properties:
        evaluation:
          $ref: '#/components/schemas/Evaluation'
        scores:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationScore'
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        created_at:
          type: string
          format: date-time
        author_id:
          type: string
          format: uuid
        author_name:
          type: string
    CommunityVote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hackathon_id:
          type: string
          format: uuid
        submission_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    AggregateResult:
      type: object
      properties:
        submission_id:
          type: string
          format: uuid
        title:
          type: string
        team_id:
          type: string
          format: uuid
        total_assignments:
          type: integer
        submitted_evaluations:
          type: integer
        missing_evaluations:
          type: integer
        aggregate_score:
          type: number
          nullable: true
        status:
          type: string
    PublicResult:
      type: object
      properties:
        submission_id:
          type: string
          format: uuid
        title:
          type: string
        team_name:
          type: string
        aggregate_score:
          type: number
          nullable: true
        community_votes:
          type: integer
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
          format: uuid
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
paths:
  /api/health:
    get:
      summary: Health check
      description: Returns system health status.
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
        '503':
          description: Unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
      security: []
      operationId: getapihealth
  /api/auth/register:
    post:
      summary: Register user
      description: Register a new account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - display_name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStandard'
        '409':
          description: Duplicate email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStandard'
      security: []
      operationId: postapiauthregister
  /api/auth/login:
    post:
      summary: Login user
      description: Authenticate and return JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStandard'
      security: []
      operationId: postapiauthlogin
  /api/auth/logout:
    post:
      summary: Logout user
      description: Invalidate the current session token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStandard'
      operationId: postapiauthlogout
  /api/auth/me:
    get:
      summary: Get current user
      description: Fetch the profile of the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStandard'
      operationId: getapiauthme
  /api/hackathons:
    get:
      summary: List hackathons
      description: Get a list of all hackathons. Requires Organizer access.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of hackathons
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Hackathon'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStandard'
        '403':
          description: Forbidden (Organizer required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStandard'
      operationId: getapihackathons
    post:
      summary: Create hackathon
      description: Create a new hackathon. Requires Organizer access.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                description:
                  type: string
                  maxLength: 10000
                  default: ''
      responses:
        '201':
          description: Hackathon created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Hackathon'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStandard'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStandard'
        '403':
          description: Forbidden (Organizer required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStandard'
      operationId: postapihackathons
  '/api/hackathons/{id}/policy':
    put:
      summary: Set hackathon policy
      description: Link a published judging policy to a hackathon. Requires Organizer access.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - policy_id
              properties:
                policy_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Policy linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Hackathon'
        '400':
          description: Validation or State Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStandard'
      operationId: putapihackathonsidpolicy
  '/api/hackathons/{id}/status':
    put:
      summary: Update hackathon status
      description: Update the lifecycle status of a hackathon. Requires Organizer access.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - DRAFT
                    - ACTIVE
                    - COMPLETED
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Hackathon'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStandard'
      operationId: putapihackathonsidstatus
  '/api/hackathons/{id}/judging-settings':
    put:
      summary: Update judging settings
      description: Update the required judges parameter. Requires Organizer access.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - required_judges
              properties:
                required_judges:
                  type: integer
                  nullable: true
                  minimum: 1
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Hackathon'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStandard'
      operationId: putapihackathonsidjudgingsettings
  '/api/hackathons/{id}/teams':
    get:
      summary: List teams
      description: Get all teams in a hackathon. Requires Organizer access.
      operationId: getHackathonTeams
      tags:
        - Organizer Teams
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        submission_id:
                          type: string
                          format: uuid
                          nullable: true
                        submission_title:
                          type: string
                          nullable: true
                        members:
                          type: array
                          nullable: true
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              email:
                                type: string
                              display_name:
                                type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
    post:
      summary: Create team
      description: Create a team in a hackathon. Requires Organizer access.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Team'
      operationId: postapihackathonsidteams
  '/api/hackathons/{id}/submissions':
    post:
      summary: Create submission (Admin)
      description: Create a submission manually on behalf of a team. Requires Organizer access.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - team_id
                - title
              properties:
                team_id:
                  type: string
                  format: uuid
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '201':
          description: Submission created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Submission'
      operationId: postapihackathonsidsubmissions
  '/api/hackathons/{id}/assignments':
    post:
      summary: Create judge assignment
      description: 'Assign a judge directly to a submission, bypassing invitations. Requires Organizer access.'
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - judge_user_id
                - submission_id
              properties:
                judge_user_id:
                  type: string
                  format: uuid
                submission_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JudgeAssignment'
        '400':
          description: Invalid data or assignment state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStandard'
      operationId: postapihackathonsidassignments
  '/api/hackathons/{id}/invitations':
    post:
      summary: Create judge invitation
      description: Invite a user to judge a specific submission. Requires Organizer access.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - judge_user_id
                - submission_id
              properties:
                judge_user_id:
                  type: string
                  format: uuid
                submission_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JudgeInvitation'
        '400':
          description: Invalid data or invitation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStandard'
      operationId: postapihackathonsidinvitations
  '/api/hackathons/{id}/results':
    get:
      summary: Get hackathon results (Admin)
      description: Retrieve complete scoring aggregation. Requires Organizer access.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Results aggregation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/AggregateResult'
      operationId: getapihackathonsidresults
  '/api/hackathons/{id}/export.csv':
    get:
      summary: Export hackathon results as CSV
      description: Downloads the aggregated scoring results in CSV format. Requires Organizer access.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: CSV file payload
          content:
            text/csv:
              schema:
                type: string
                format: binary
      operationId: getapihackathonsidexportcsv
  /api/judging/assignments:
    get:
      summary: Get judge assignments
      description: List active assignments for the authenticated user. Implicitly handles Judge isolation.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JudgeAssignment'
      operationId: getapijudgingassignments
  /api/judging/invitations:
    get:
      summary: Get judge invitations
      description: List pending invitations for the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of invitations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JudgeInvitation'
      operationId: getapijudginginvitations
  '/api/judging/invitations/{id}/accept':
    post:
      summary: Accept judge invitation
      description: Transitions invitation to ACCEPTED and creates an assignment.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Accepted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
      operationId: postapijudginginvitationsidaccept
  '/api/judging/invitations/{id}/decline':
    post:
      summary: Decline judge invitation
      description: Transitions invitation to DECLINED.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Declined successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
      operationId: postapijudginginvitationsiddecline
  '/api/judging/submissions/{submissionId}/evaluation':
    get:
      summary: Get submission evaluation
      description: Get the authenticated judge's evaluation state for a specific submission. Isolates judges so they cannot see peer scores.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: submissionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Evaluation object
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EvaluationDetail'
      operationId: getapijudgingsubmissionssubmissionIdevaluation
